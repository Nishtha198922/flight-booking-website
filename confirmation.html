<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="confirmation.css">
    <script src="confirmation.js" defer></script>
    <title>AeroBook | Booking Confirmed</title>
</head>

<body class="success-page">

    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-plane"></i>
                <h2>AeroBook</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="flight.html">Flights</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>


    <main class="success-container">
        <i class="fa-solid fa-circle-check success-icon"></i>
        <h1>Booking Confirmed!</h1>
        <p>Your flight from <strong id="success-from">New Delhi</strong> to <strong id="success-to">Mumbai</strong> is
            successfully booked.</p>

        <div class="pnr-box">
            <p>Booking Reference (PNR)</p>
            <h2 id="pnr-number">LOADING...</h2>
        </div>

        <p class="email-notice">We have sent the e-ticket to your email address.</p>

        <div class="success-actions">
            <button class="btn-download" onclick="window.print()">Download E-Ticket</button>
            <a href="index.html" class="btn-home">Return to Home</a>
        </div>
    </main>

</body>

</html>
