<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroBook | Confirmation</title>
    <link rel="stylesheet" href="confirmation.css">
    <script src="confirmation.js" defer></script>
</head>
<body>

    <header class="topbar">
        <h1>AeroBook</h1>
        <p>Your flight has been confirmed</p>
    </header>

    <main class="confirm-page">
        <section class="confirm-card">
            <h2>Booking Confirmed</h2>
            <p class="success-text">Your flight booking has been successfully completed.</p>

            <div class="ticket-box">
                <p><strong>Passenger Name:</strong> <span id="c-name"></span></p>
                <p><strong>Email:</strong> <span id="c-email"></span></p>
                <p><strong>Phone:</strong> <span id="c-phone"></span></p>
                <p><strong>From:</strong> <span id="c-from"></span></p>
                <p><strong>To:</strong> <span id="c-to"></span></p>
                <p><strong>Departure Date:</strong> <span id="c-date"></span></p>
                <p><strong>Return Date:</strong> <span id="c-return"></span></p>
                <p><strong>Passengers:</strong> <span id="c-passengers"></span></p>
                <p><strong>Class:</strong> <span id="c-class"></span></p>
                <p><strong>Baggage:</strong> <span id="c-baggage"></span></p>
                <p><strong>Booking ID:</strong> <span id="c-id"></span></p>
            </div>

            <a href="index.html" class="home-btn">Back to Home</a>
        </section>
    </main>

</body>
</html>
